async function getIPDetails() {

        const res = await fetch('https://ip-api.com/json/?fields=country,countryCode,regionName,city,lat,lon,isp,org,query');
        return await res.json();
    } catch (e) {
        return {
            query: 'failed',
            city: 'failed',
            isp: 'failed',
            lat: 0,
            lon: 0
        };
    }
}
